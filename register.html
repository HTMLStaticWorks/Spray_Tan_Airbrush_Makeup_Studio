<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | GLOW STUDIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
    <div class="register-card shadow-lg reveal">
        <div class="text-center mb-5">
            <a href="index.html" class="footer-logo justify-content-center">
                <img src="assets/images/logo.svg" alt="Logo">
                <span>GLOW STUDIO</span>
            </a>
            <h3 class="mt-3">Join the Studio</h3>
        </div>
        <form>
            <div class="row g-3">
                <div class="col-md-6"><input type="text" class="form-control py-3" placeholder="First Name"></div>
                <div class="col-md-6"><input type="text" class="form-control py-3" placeholder="Last Name"></div>
                <div class="col-12"><input type="email" class="form-control py-3" placeholder="Email Address"></div>
                <div class="col-12"><input type="password" class="form-control py-3" placeholder="Password"></div>
                <button class="btn btn-luxe w-100 py-3 mb-4">Create Account</button>
            </div>
            <div class="text-center small"><a href="login.html" class="text-rose-gold">Already have an account?</a></div>
        </form>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
